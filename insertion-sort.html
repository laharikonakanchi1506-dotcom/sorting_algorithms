<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insertion Sort Visualizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; font-family: system-ui, sans-serif; color: #222; }
    .container { padding: 2rem 1.5rem; max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.4rem; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 1.5rem; }
    .input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .input-row input { border: 1px solid #bbb; border-radius: 8px; padding: 7px 12px; font-size: 13px; width: 260px; color: #222; background: #fff; }
    .speed-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
    .speed-row label { font-size: 13px; color: #666; }
    .speed-row input[type=range] { width: 120px; }
    .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .btn { padding: 7px 18px; border: 1px solid #bbb; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; color: #222; transition: background 0.15s, transform 0.1s; }
    .btn:hover { background: #f0f0f0; }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: #222; color: #fff; border-color: #222; }
    .btn.primary:hover { background: #444; }
    .viz-area { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 1.5rem 1rem; min-height: 220px; display: flex; align-items: flex-end; gap: 6px; overflow: hidden; }
    .block { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; border-radius: 6px 6px 3px 3px; flex-shrink: 0; transition: height 0.18s ease, background 0.15s ease; }
    .block-num { font-size: 12px; font-weight: 500; padding: 3px 0 4px; color: #fff; text-align: center; width: 100%; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 1rem; font-size: 12px; color: #666; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
    .stats-row { display: flex; gap: 20px; margin-top: 0.75rem; }
    .stat { font-size: 13px; color: #666; }
    .stat span { font-weight: 500; color: #222; }
    .status-bar { margin-top: 0.75rem; font-size: 13px; color: #666; min-height: 20px; }
    .algo-tag { display: inline-block; background: #7F77DD; color: #fff; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 6px; margin-bottom: 1rem; letter-spacing: 0.03em; }
  </style>
</head>
<body>
<div class="container">
  <div class="algo-tag">Insertion Sort</div>
  <h1>Insertion sort visualizer</h1>
  <p class="subtitle">Builds a sorted array one element at a time by inserting each into its correct position. O(n²) worst case, O(n) best case.</p>

  <div class="input-row">
    <input type="text" id="customInput" placeholder="e.g. 42, 15, 8, 99, 3, 27" />
    <button class="btn" onclick="applyCustom()">Apply</button>
    <button class="btn" onclick="randomize()">Random</button>
  </div>

  <div class="speed-row">
    <label>Speed</label>
    <input type="range" id="speedSlider" min="1" max="5" step="1" value="3" oninput="updateSpeedLabel(this.value)" />
    <label id="speedLabel" style="min-width:72px;">Medium</label>
  </div>

  <div class="action-btns">
    <button class="btn primary" id="startBtn" onclick="startSort()">Sort</button>
    <button class="btn" onclick="pauseResume()" id="pauseBtn" style="display:none;">Pause</button>
    <button class="btn" onclick="resetViz()">Reset</button>
    <button class="btn" onclick="stepOnce()">Step</button>
  </div>

  <div class="viz-area" id="vizArea"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#378ADD;"></div>Default</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E24B4A;"></div>Comparing</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EF9F27;"></div>Inserting</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1D9E75;"></div>Sorted</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7F77DD;"></div>Current key</div>
  </div>

  <div class="stats-row">
    <div class="stat">Comparisons: <span id="cmpCount">0</span></div>
    <div class="stat">Shifts: <span id="swpCount">0</span></div>
  </div>
  <div class="status-bar" id="statusBar">Press Sort or Step to begin.</div>
</div>

<script>
  let arr = [42, 15, 8, 99, 3, 27, 61, 34];
  let steps = [], stepIdx = 0;
  let running = false, paused = false;
  let timer = null, comparisons = 0, swaps = 0;
  const speedMap = { 1: 600, 2: 300, 3: 120, 4: 50, 5: 15 };
  const speedLabels = { 1: 'Very slow', 2: 'Slow', 3: 'Medium', 4: 'Fast', 5: 'Very fast' };

  function updateSpeedLabel(v) { document.getElementById('speedLabel').textContent = speedLabels[v]; }

  function randomize() {
    const n = Math.floor(Math.random() * 5) + 6;
    arr = Array.from({ length: n }, () => Math.floor(Math.random() * 90) + 5);
    document.getElementById('customInput').value = arr.join(', ');
    resetViz();
  }

  function applyCustom() {
    const nums = document.getElementById('customInput').value.split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n > 0);
    if (nums.length < 2) { document.getElementById('statusBar').textContent = 'Please enter at least 2 numbers.'; return; }
    if (nums.length > 20) { document.getElementById('statusBar').textContent = 'Max 20 numbers allowed.'; return; }
    arr = nums; resetViz();
  }

  function resetViz() {
    clearTimeout(timer); running = false; paused = false;
    steps = []; stepIdx = 0; comparisons = 0; swaps = 0;
    document.getElementById('cmpCount').textContent = 0;
    document.getElementById('swpCount').textContent = 0;
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('startBtn').style.display = '';
    document.getElementById('statusBar').textContent = 'Ready to sort.';
    renderBlocks(arr, {});
  }

  function renderBlocks(data, highlight) {
    const area = document.getElementById('vizArea');
    const max = Math.max(...data);
    const n = data.length;
    const availW = area.clientWidth || 680;
    const blockW = Math.max(28, Math.min(58, Math.floor((availW - (n - 1) * 6) / n)));
    area.innerHTML = '';
    data.forEach((v, i) => {
      const h = 36 + Math.round((v / max) * 134);
      const div = document.createElement('div');
      div.className = 'block';
      div.style.width = blockW + 'px';
      div.style.height = h + 'px';
      let bg = '#378ADD';
      if (highlight.sorted && highlight.sorted.includes(i)) bg = '#1D9E75';
      if (highlight.comparing && highlight.comparing.includes(i)) bg = '#E24B4A';
      if (highlight.swapping && highlight.swapping.includes(i)) bg = '#EF9F27';
      if (highlight.current === i) bg = '#7F77DD';
      div.style.background = bg;
      const num = document.createElement('div');
      num.className = 'block-num'; num.textContent = v;
      div.appendChild(num); area.appendChild(div);
    });
  }

  function generateSteps(a) {
    const arr = [...a], steps = [], n = arr.length;
    steps.push({ arr: [...arr], highlight: { sorted: [0] }, msg: 'Element 0 is trivially sorted.', type: 'info' });
    for (let i = 1; i < n; i++) {
      const key = arr[i];
      steps.push({ arr: [...arr], highlight: { current: i, sorted: arr.slice(0, i).map((_, j) => j) }, msg: `Picking ${key} to insert into sorted portion.`, type: 'compare' });
      let j = i - 1;
      while (j >= 0 && arr[j] > key) {
        steps.push({ arr: [...arr], highlight: { comparing: [j, j + 1], current: i, sorted: arr.slice(0, i).map((_, k) => k) }, msg: `${arr[j]} > ${key}, shifting right.`, type: 'compare' });
        arr[j + 1] = arr[j];
        steps.push({ arr: [...arr], highlight: { swapping: [j, j + 1], sorted: arr.slice(0, i).map((_, k) => k) }, msg: `Shifted ${arr[j + 1]} to the right.`, type: 'swap' });
        j--;
      }
      arr[j + 1] = key;
      steps.push({ arr: [...arr], highlight: { swapping: [j + 1], sorted: arr.slice(0, i + 1).map((_, k) => k) }, msg: `Inserted ${key} at position ${j + 1}.`, type: 'swap' });
    }
    steps.push({ arr: [...arr], highlight: { sorted: arr.map((_, i) => i) }, msg: 'Array sorted!', type: 'done' });
    return steps;
  }

  function startSort() {
    if (running) return;
    comparisons = 0; swaps = 0;
    document.getElementById('cmpCount').textContent = 0;
    document.getElementById('swpCount').textContent = 0;
    steps = generateSteps(arr); stepIdx = 0; running = true; paused = false;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = '';
    runNextStep();
  }

  function runNextStep() {
    if (!running || paused) return;
    if (stepIdx >= steps.length) { running = false; document.getElementById('pauseBtn').style.display = 'none'; document.getElementById('startBtn').style.display = ''; return; }
    applyStep(steps[stepIdx++]);
    timer = setTimeout(runNextStep, speedMap[document.getElementById('speedSlider').value]);
  }

  function applyStep(s) {
    renderBlocks(s.arr, s.highlight);
    document.getElementById('statusBar').textContent = s.msg;
    if (s.type === 'compare') { comparisons++; document.getElementById('cmpCount').textContent = comparisons; }
    if (s.type === 'swap') { swaps++; document.getElementById('swpCount').textContent = swaps; }
  }

  function pauseResume() {
    if (!running) return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    if (!paused) runNextStep();
  }

  function stepOnce() {
    if (running && !paused) { paused = true; document.getElementById('pauseBtn').textContent = 'Resume'; return; }
    if (steps.length === 0) {
      comparisons = 0; swaps = 0;
      document.getElementById('cmpCount').textContent = 0;
      document.getElementById('swpCount').textContent = 0;
      steps = generateSteps(arr); stepIdx = 0; running = true;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('pauseBtn').style.display = '';
    }
    if (stepIdx < steps.length) applyStep(steps[stepIdx++]);
    if (stepIdx >= steps.length) { running = false; document.getElementById('pauseBtn').style.display = 'none'; document.getElementById('startBtn').style.display = ''; }
  }

  randomize();
</script>
</body>
</html>
